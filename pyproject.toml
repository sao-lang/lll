[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "AgentKit: an Effect-interpreter based agent runtime with pluggable harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "coverage>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
source = ["runtime", "compose", "harness.resilience", "harness.model", "harness.tools", "harness.skills", "harness.rag", "harness.context", "harness.memory", "harness.cognition", "harness.security", "harness.observability", "harness.eval", "harness.durability", "ports"]
branch = true
