<svg viewBox="0 0 680 566" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>R3 九个可靠性插件迁入 AOP 五角色 + 降级单独裁决</title>
  <desc>可靠性插件按语义迁入 AOP 五角色固定顺序；熔断命中写 fault + Verdict(allowed=True) 走重路由（非终止短路）；Degradation 为唯一选级者，保 P9 降级四坑；故障经 Invocation.meta 具名 typed 记录传网关</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="26" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#2C2C2A">R3 可靠性 · 插件 = AOP 增强器（name + 实例状态 + 构造注入，无 priority）</text>

  <rect x="40" y="42" width="600" height="300" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="62" font-family="var(--font-sans)" font-size="12" font-weight="500" fill="#0C447C">AOPContainer 固定顺序（Invocation 请求期上下文 · meta 具名故障记录）</text>

  <g>
    <rect x="56" y="74" width="176" height="58" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="144" y="92" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Warden · 准入</text>
    <text x="144" y="110" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">KillSwitch / Watchdog</text>
    <text x="144" y="125" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">Idempotency / RateLimit / Breaker.check</text>
  </g>
  <line x1="232" y1="103" x2="260" y2="103" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="262" y="74" width="176" height="58" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="350" y="92" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Envelope · 环绕</text>
    <text x="350" y="110" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">RetryPolicy / Timeout</text>
    <text x="350" y="125" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">Bulkhead / Breaker.observe</text>
  </g>
  <line x1="438" y1="103" x2="466" y2="103" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="468" y="74" width="156" height="58" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="546" y="92" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Refiner · 转换</text>
    <text x="546" y="112" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">BudgetGuard 软预算提示</text>
  </g>

  <line x1="546" y1="132" x2="546" y2="156" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="468" y="158" width="156" height="46" rx="8" fill="#85B7EB" stroke="#0C447C" stroke-width="0.5"/>
    <text x="546" y="175" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Port call</text>
    <text x="546" y="192" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">中心网关调用</text>
  </g>
  <line x1="466" y1="181" x2="440" y2="181" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="262" y="158" width="176" height="46" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="350" y="175" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Envelope 后 / Prelude</text>
    <text x="350" y="192" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">observe 记数 · 外层包裹</text>
  </g>

  <g>
    <rect x="56" y="158" width="176" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="144" y="175" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#791F1F">终止类 Warden</text>
    <text x="144" y="192" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#A32D2D">allowed=False → invoke_rejected</text>
  </g>

  <g>
    <rect x="56" y="226" width="568" height="98" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="72" y="245" font-family="var(--font-sans)" font-size="12" font-weight="500" fill="#633806">降级类故障 → 写 fault + Verdict(allowed=True) → 容器走链外 Salvage 重路由</text>
    <text x="72" y="265" font-family="var(--font-sans)" font-size="11" fill="#854F0B">熔断命中 / Retry 耗尽 / Timeout / Bulkhead满：inv.write_fault(FaultRecord(reason, failed_target))</text>
    <text x="72" y="284" font-family="var(--font-sans)" font-size="11" fill="#854F0B">Warden/Envelope 只报告故障、不做选级；Degradation.select(fault) 按 failed_target 剔除并选下一级</text>
    <text x="72" y="303" font-family="var(--font-sans)" font-size="11" fill="#854F0B">重路由重跑跳过一次性 Warden（include_wardens=False），防幂等键自命中；阶梯收敛到 refuse（上限 8 轮）</text>
  </g>
  <text x="56" y="333" font-family="var(--font-sans)" font-size="11" fill="#0C447C">注：熔断=写 fault + 放行重路由（非 allowed=False 短路）——短路会摧毁降级切 backup 语义</text>

  <rect x="40" y="356" width="600" height="200" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="56" y="376" font-family="var(--font-sans)" font-size="12" font-weight="500" fill="#085041">Degradation · 唯一选级者 · P9 四坑（实例化状态 dict[session_id, 状态]）</text>
  <g font-family="var(--font-sans)" font-size="11" fill="#04342C">
    <text x="56" y="402">B1 会话隔离</text><text x="220" y="402">按 session_id 隔离目标状态，禁容器级单值</text>
    <text x="56" y="426">B2 目标维度</text><text x="220" y="426">failed_target = 降级阶梯后端注册名，非维度二元组；未注册 → TargetUnresolved 不回退</text>
    <text x="56" y="450">R3-6 永久剔除</text><text x="220" y="450">故障目标从本会话 available 永久剔除并写回（非局部副本）</text>
    <text x="56" y="474">R3-7 故障带目标</text><text x="220" y="474">retry/timeout/breaker 的 fault 必带 failed_target（构造注入 failed_target_of）</text>
    <text x="56" y="498">typed 路径</text><text x="220" y="498">select 产出写 Invocation.meta RoutingTarget → 网关按注册名切后端 / REFUSE</text>
  </g>
  <g>
    <rect x="440" y="516" width="188" height="30" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="534" y="531" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#04342C">Warden/Envelope 只报故障不选级</text>
  </g>
</svg>
