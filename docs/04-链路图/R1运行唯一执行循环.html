<svg viewBox="0 0 680 370" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>R1 Runner 唯一执行循环</title>
  <desc>Program yield Effect，经解释器展开批次，Runner 编排预算与调用，fold 纯函数折叠状态，写事件与快照后回填 Program</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="26" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#2C2C2A">R1 Runner 唯一执行循环 · 一次 step</text>

  <g>
    <rect x="130" y="44" width="380" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="320" y="61" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#0C447C">Program generator</text>
    <text x="320" y="78" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#185FA5">读 State → yield Effect（业务本体，纯逻辑）</text>
  </g>
  <line x1="320" y1="90" x2="320" y2="106" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="130" y="108" width="380" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="320" y="125" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#0C447C">Interpreter.send</text>
    <text x="320" y="142" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#185FA5">next/send 推进 · 展开 batch → EffectBatch</text>
  </g>
  <line x1="320" y1="154" x2="320" y2="170" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="130" y="172" width="380" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="320" y="189" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#0C447C">Runner.step 编排</text>
    <text x="320" y="206" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#185FA5">预算预检 · trace_id · 并发 dispatch → call</text>
  </g>
  <line x1="320" y1="218" x2="320" y2="234" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="130" y="236" width="380" height="46" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="320" y="253" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#085041">fold 纯函数</text>
    <text x="320" y="270" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#0F6E56">Effect+Result → 新 State（不可变）· 统一扣预算</text>
  </g>
  <line x1="320" y1="282" x2="320" y2="298" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="130" y="300" width="380" height="46" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="320" y="317" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#085041">Event + checkpoint</text>
    <text x="320" y="334" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#0F6E56">追加事件日志（ts=逻辑步号）· 落快照</text>
  </g>

  <path d="M130 323 L95 323 L95 67 L126 67" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="42" y="192" font-family="var(--font-sans)" font-size="11" fill="#5F5E5A">回填</text>
  <text x="42" y="207" font-family="var(--font-sans)" font-size="11" fill="#5F5E5A">result</text>
</svg>
