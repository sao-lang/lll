<svg viewBox="0 0 680 560" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>R2 算子核心：call 装饰器链 + dispatch（②领域策略归 R3）</title>
  <desc>算子核心：①A 类算子装配 Program（装配期）；③call 装饰器链（retry_call/timeout/danger_route/injection_guard）为纯函数组合，不再驱动任何 check/observe 协议；dispatch/make_dispatch 按 effect.port 分派到 Port 构造 Result；④notify 旁路观察 16 相位。R1 只认注入的 call + notify，一行不改。承载形态②已由 R3 的 ReliabilityExecutor + 9 领域策略显式编排实现（原 Guard/check/observe 拦截协议已删除），不在本图范围。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", sans-serif; }
      .h { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .n { font-size: 12px; fill: #1e293b; }
      .s { font-size: 10.5px; fill: #475569; }
      .box { fill: #f8fafc; stroke: #94a3b8; rx: 8; }
      .op { fill: #eff6ff; stroke: #3b82f6; rx: 8; }
      .gd { fill: #fef2f2; stroke: #ef4444; rx: 8; }
      .nt { fill: #f0fdf4; stroke: #22c55e; rx: 8; }
      .core { fill: #f5f3ff; stroke: #8b5cf6; rx: 8; }
      .e { stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow); }
      .edge-label { font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <text class="t h" x="340" y="28" text-anchor="middle">R2 算子核心 · call 装配链（AOP 取消）</text>
  <text class="t s" x="340" y="46" text-anchor="middle">①算子装配 Program（装配期） → ③装饰器 + dispatch（运行期） → 注入 R1（②领域策略归 R3 执行器）</text>

  <rect class="op" x="30" y="66" width="620" height="86"/>
  <text class="t h" x="44" y="86" fill="#1d4ed8">① A 类组合算子（装配期，Program → Program）</text>
  <g class="t n">
    <text x="44" y="108">seq · par · branch · race · loop · map_state</text>
    <text x="44" y="128">map_effect · fallback · gate（可 yield Suspend）· retry（流程级）</text>
  </g>
  <text class="t s" x="400" y="108">纯函数 · 状态进 State.scratch 的 x-*</text>
  <text class="t s" x="400" y="128">compile 幂等 · 实例不持流程进度（resume 靠 program_factory）</text>

  <line class="e" x1="340" y1="152" x2="340" y2="172"/>
  <text class="t edge-label" x="348" y="166">装配 + 构造 call</text>

  <rect class="box" x="30" y="176" width="620" height="200"/>
  <text class="t h" x="44" y="198">③ call 装饰器链（CallFn → CallFn，只覆盖 Invoke）</text>
  <rect class="op" x="44" y="210" width="130" height="40"/>
  <text class="t n" x="109" y="234" text-anchor="middle">retry_call</text>
  <line class="e" x1="174" y1="230" x2="196" y2="230"/>
  <rect class="op" x="196" y="210" width="118" height="40"/>
  <text class="t n" x="255" y="234" text-anchor="middle">timeout</text>
  <line class="e" x1="314" y1="230" x2="336" y2="230"/>
  <rect class="op" x="336" y="210" width="150" height="40"/>
  <text class="t n" x="411" y="234" text-anchor="middle">danger_route</text>
  <line class="e" x1="486" y1="230" x2="508" y2="230"/>
  <rect class="op" x="508" y="210" width="126" height="40"/>
  <text class="t n" x="571" y="234" text-anchor="middle">injection_guard</text>

  <line class="e" x1="340" y1="250" x2="340" y2="272"/>
  <rect class="gd" x="150" y="272" width="380" height="44"/>
  <text class="t n" x="340" y="290" text-anchor="middle">③ 装饰器链收口：纯函数组合，只覆盖 Invoke（D-7）</text>
  <text class="t s" x="340" y="306" text-anchor="middle">②领域策略由 R3 ReliabilityExecutor 显式编排（原 check/observe 协议已删除），不在本链</text>

  <line class="e" x1="340" y1="316" x2="340" y2="336"/>
  <rect class="core" x="200" y="336" width="280" height="30"/>
  <text class="t n" x="340" y="355" text-anchor="middle">dispatch：按 effect.port 分派 → Result(含 Usage)</text>

  <line class="e" x1="340" y1="376" x2="340" y2="398"/>
  <rect class="core" x="180" y="398" width="320" height="42"/>
  <text class="t h" x="340" y="416" text-anchor="middle">R1 Runner（一行不改）</text>
  <text class="t s" x="340" y="432" text-anchor="middle">Runner(call=build_call(base, decorators=(...)), notify=...) · 只认 Program + call + notify</text>

  <rect class="nt" x="30" y="466" width="620" height="72"/>
  <text class="t h" x="44" y="488" fill="#15803d">④ notify 观察（R1 既有回调，16 相位口径保留）</text>
  <text class="t n" x="44" y="510">会话/轮次 5 · 能力调用 5 · 子 Agent 2 · 控制流 3 · invoke_rejected 1</text>
  <text class="t s" x="44" y="528">链路追踪 / 审计 / 指标 / 成本归因挂此口；返回值不消费、异常就地隔离</text>
</svg>
