<svg viewBox="0 0 680 560" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>R2 AOP 五角色增强链 + Lifecycle 通知旁路</title>
  <desc>三体系正交：Port 回答 what、AOP 增强器回答 how（五角色固定顺序编排、返回值被消费）、Lifecycle 通知回答 when（16 相位、纯通知、不消费返回值）。内核只认 call + notify，装配层用 as_call 构造 Invocation、用 runner_notifier 桥接通知</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="26" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#2C2C2A">R2 装配层 · AOP 五角色（how）+ Lifecycle 16 通知（when）</text>

  <rect x="40" y="42" width="600" height="252" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="62" font-family="var(--font-sans)" font-size="12" font-weight="500" fill="#0C447C">AOPContainer · 固定顺序（无 priority）· Invocation 为请求期上下文（meta 具名记录）</text>

  <g>
    <rect x="56" y="74" width="168" height="46" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="140" y="91" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Prelude.run</text>
    <text x="140" y="108" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">最外层包裹 · 预留</text>
  </g>
  <line x1="224" y1="97" x2="256" y2="97" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="258" y="74" width="168" height="46" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="342" y="91" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Warden.guard</text>
    <text x="342" y="108" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">准入 → Verdict</text>
  </g>
  <line x1="426" y1="97" x2="458" y2="97" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="460" y="74" width="168" height="46" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="544" y="91" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Envelope.wrap 前</text>
    <text x="544" y="108" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">Retry / Timeout / Bulkhead</text>
  </g>

  <line x1="544" y1="120" x2="544" y2="142" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="460" y="144" width="168" height="46" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="544" y="161" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Refiner.refine</text>
    <text x="544" y="178" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">改写 / 预算提示</text>
  </g>
  <line x1="458" y1="167" x2="426" y2="167" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="258" y="144" width="168" height="46" rx="8" fill="#85B7EB" stroke="#0C447C" stroke-width="0.5"/>
    <text x="342" y="161" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Port call（中心）</text>
    <text x="342" y="178" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">core = gateway.as_call()</text>
  </g>
  <line x1="256" y1="167" x2="224" y2="167" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="56" y="144" width="168" height="46" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="140" y="161" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53">Envelope.wrap 后</text>
    <text x="140" y="178" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0C447C">observe / release</text>
  </g>

  <line x1="342" y1="190" x2="342" y2="212" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="200" y="214" width="284" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="342" y="231" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#791F1F">Salvage.recover · 链外兜底（异常/失败）</text>
    <text x="342" y="248" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#A32D2D">Degradation 选级 → 重路由切 backup / REFUSE（上限 8 轮）</text>
  </g>
  <line x1="140" y1="190" x2="140" y2="236" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="56" y="280" font-family="var(--font-sans)" font-size="11" fill="#0C447C">Warden 终止类拒绝（无 fault）→ 短路 + 发 invoke_rejected；降级类（熔断/重试耗尽）→ 写 fault + allowed=True → 容器走 Salvage</text>

  <rect x="40" y="308" width="600" height="228" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="56" y="328" font-family="var(--font-sans)" font-size="12" font-weight="500" fill="#085041">LifecycleBus · 16 相位（PHASE_COUNT=16）· 纯通知、不拦截、异常就地隔离</text>

  <g font-family="var(--font-sans)" font-size="11" fill="#04342C">
    <text x="56" y="352">会话/轮次</text><text x="56" y="368">session_start · user_prompt · session_end · state_fold · budget_check</text>
    <text x="56" y="392">能力调用</text><text x="56" y="408">before_model / after_model（R4 gateway 发）· before_tool / after_tool / tool_error（Runner 在 Invoke(port=tool) 发）</text>
    <text x="56" y="432">子 Agent</text><text x="56" y="448">child_spawn · child_done（Runner 发）</text>
    <text x="56" y="472">控制流</text><text x="56" y="488">cancelled · wait_human · resumed（Runner 发）</text>
    <text x="56" y="512">AOP 拒绝</text><text x="56" y="528">invoke_rejected（容器发，堵住拒绝审计盲区）</text>
  </g>
  <g>
    <rect x="440" y="340" width="188" height="66" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="534" y="358" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" font-weight="500" fill="#04342C">runner_notifier(bus)</text>
    <text x="534" y="376" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#085041">Runner.notify → 总线桥接</text>
    <text x="534" y="393" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#085041">Notice = Invocation 只读投影</text>
  </g>
  <g>
    <rect x="440" y="418" width="188" height="98" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="534" y="437" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" font-weight="500" fill="#2C2C2A">on_error 异常钩子</text>
    <text x="534" y="456" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#5F5E5A">订阅者异常就地隔离</text>
    <text x="534" y="473" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#5F5E5A">可选钩子交装配层观测</text>
    <text x="534" y="490" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#5F5E5A">钩子自身异常也隔离</text>
    <text x="534" y="507" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#5F5E5A">默认静默（R10 接）</text>
  </g>
</svg>
