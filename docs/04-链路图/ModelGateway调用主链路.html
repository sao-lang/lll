<svg viewBox="0 0 680 440" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ModelGateway.complete 调用主链路</title>
  <desc>缓存查询、singleflight与成本预留、路由解析、后端调用与校验修复、结算与写缓存五个阶段</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="28" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#2C2C2A">ModelGateway.complete() 主链路</text>

  <g>
    <rect x="140" y="50" width="400" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="69" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#0C447C">1 · 缓存查询</text>
    <text x="340" y="87" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#185FA5">cache.get 命中即短路，不路由不记账</text>
  </g>
  <line x1="340" y1="100" x2="340" y2="128" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="140" y="130" width="400" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="149" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#0C447C">2 · 并发合并 + 成本预留</text>
    <text x="340" y="167" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#185FA5">singleflight 同 key 共享一次调用 · CostGuard.reserve</text>
  </g>
  <line x1="340" y1="180" x2="340" y2="208" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="140" y="210" width="400" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="229" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#0C447C">3 · 路由解析</text>
    <text x="340" y="247" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#185FA5">router 选模型 → registry 映射真实 LLMPort 实例</text>
  </g>
  <line x1="340" y1="260" x2="340" y2="288" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="140" y="290" width="400" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="309" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#0C447C">4 · 后端调用 + 结构化校验/修复</text>
    <text x="340" y="327" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#185FA5">llm.complete → check → repair（最多 max_repair 次）</text>
  </g>
  <line x1="340" y1="340" x2="340" y2="368" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="140" y="370" width="400" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="389" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#0C447C">5 · 结算 + 写缓存</text>
    <text x="340" y="407" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#185FA5">commit 按实结清 · ledger 记账 · 非法输出不写缓存</text>
  </g>
</svg>
