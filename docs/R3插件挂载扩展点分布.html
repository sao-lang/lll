<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>R3 可靠性插件挂载的 hook 扩展点</title>
  <desc>守卫类挂 before_invoke，聚合类挂 around_invoke，降级裁决挂 settle，观察类挂 after_invoke，预算提示挂 transform</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="26" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#2C2C2A">插件挂在哪里（执行顺序自上而下）</text>

  <g>
    <rect x="40" y="42" width="240" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="160" y="59" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#791F1F">before_invoke · BAIL 守卫</text>
    <text x="160" y="77" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#A32D2D">短路，直接 Decision</text>
  </g>
  <line x1="280" y1="66" x2="352" y2="66" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="356" y="42" width="284" height="48" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="498" y="59" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#085041">killswitch · watchdog · idempotency</text>
    <text x="498" y="77" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#085041">bulkhead · ratelimit · breaker.check</text>
  </g>

  <g>
    <rect x="40" y="106" width="240" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="160" y="123" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#3C3489">around_invoke · AROUND 包裹</text>
    <text x="160" y="141" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#534AB7">每次尝试独立计时/重试</text>
  </g>
  <line x1="280" y1="130" x2="352" y2="130" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="356" y="106" width="284" height="48" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="498" y="130" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#085041">timeout（内层）→ retry（外层）</text>
  </g>

  <g>
    <rect x="40" y="170" width="240" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="160" y="190" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#2C2C2A">真实调用 · 内核零策略</text>
  </g>
  <g>
    <rect x="356" y="170" width="284" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="498" y="190" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#444441">Port / 模型后端执行一次</text>
  </g>

  <g>
    <rect x="40" y="226" width="240" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="160" y="243" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#633806">after_invoke · PARALLEL 观察</text>
    <text x="160" y="261" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#854F0B">结果回喂，不改流程</text>
  </g>
  <line x1="280" y1="250" x2="352" y2="250" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="356" y="226" width="284" height="48" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="498" y="250" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#085041">breaker.observe 记入滑窗</text>
  </g>

  <g>
    <rect x="40" y="290" width="240" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="160" y="307" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#3C3489">settle · 降级裁决</text>
    <text x="160" y="325" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#534AB7">有 degrade 信号才选级</text>
  </g>
  <line x1="280" y1="314" x2="352" y2="314" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="356" y="290" width="284" height="48" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="498" y="307" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#085041">degradation：剔除失败目标</text>
    <text x="498" y="325" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#0F6E56">选 quality 最高级，兜底 REFUSE</text>
  </g>

  <g>
    <rect x="40" y="354" width="240" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="160" y="371" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#0C447C">transform · WATERFALL</text>
    <text x="160" y="389" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="11" fill="#185FA5">改写上下文文本</text>
  </g>
  <line x1="280" y1="378" x2="352" y2="378" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="356" y="354" width="284" height="48" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="498" y="378" text-anchor="middle" dominant-baseline="central" font-family="var(--font-sans)" font-size="12" fill="#085041">budgetguard：追加收尾提示</text>
  </g>
</svg>
